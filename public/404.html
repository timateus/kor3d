<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>KÖR3D</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a direct link or
      // refresh to e.g. /kor3d/alakol 404s. This re-encodes the
      // path into a query string and redirects to the app root, where
      // index.html's bootstrap script below decodes it back before
      // React Router mounts.
      var pathSegmentsToKeep = 1; // keep "/kor3d"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
